name: iRemote

options:
  bundleIdPrefix: io.github.jono-shaw
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  iRemote:
    type: application
    platform: macOS
    sources:
      - path: iRemote
        excludes:
          - "Resources/Info.plist"
          - "Resources/iRemote.entitlements"
          # The Tools/ scripts ship as resources, NOT as build
          # sources: extract-remote-opus.swift / decode-remote-opus.c
          # are compiled to /tmp on first use by the running app;
          # remote-dictate-once.sh is a shell script. None of them
          # belong in the main target's compile phase.
          - "Resources/Tools/**"
      - path: iRemote/Resources/Tools
        type: folder
    info:
      path: iRemote/Resources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Jono Shaw. Released under the MIT License."
        NSBluetoothAlwaysUsageDescription: "iRemote uses your paired Siri Remote for trackpad navigation, button events, and microphone dictation."
        NSMicrophoneUsageDescription: "iRemote dictates audio captured from the Siri Remote's built-in microphone. No system microphone is used."
        CFBundleIconFile: iRemote
        # CFBundleName is the canonical short name (≤15 chars); the
        # display name is what System Settings (Accessibility,
        # Privacy & Security, etc.) shows. Setting both explicitly
        # means the visible name is "iRemote" regardless of what
        # the .app file on disk happens to be called.
        CFBundleName: iRemote
        CFBundleDisplayName: iRemote
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    entitlements:
      path: iRemote/Resources/iRemote.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.bluetooth: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jono-shaw.iRemote
        PRODUCT_NAME: iRemote
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: iRemote/iRemote-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
